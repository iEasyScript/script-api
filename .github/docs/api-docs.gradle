// Groovy, so the Dokka types resolve at runtime from the root classpath the init script put them on.
def apiVersion = System.getenv('API_VERSION') ?: 'dev'
def engineTag = System.getenv('ENGINE_TAG') ?: 'main'
def docsDir = new File(System.getenv('API_DOCS_DIR'))
def java = System.getenv('API_DOCS_LANGUAGE') == 'java'

// The packages the API changelog treats as public; everything else in the engine is suppressed.
def apiPackages = /com\.projectx\.(script|webwalker|game\.interfaces|game\.nxt\.entity|game\.cs2|game\.items|game\.chat|ui\.compose\.components|ui\.compose\.theme|ui\.backend\.dsl)(\..*)?/
def partialPackages = ['com/projectx/ui': ['Setting.kt'], 'com/projectx/ui/compose': ['OverlayInput.kt'],
    'com/projectx/pathfinder': ['WalkMap.kt', 'RouteFinder.kt', 'WorldCollision.kt'],
    'com/projectx/traversal': ['MasterFarmerHat.kt', 'TraversalBuilder.kt', 'JavaTraversal.kt'],
    'com/projectx/traversal/local': ['LocalNav.kt'], 'com/projectx/util': ['Area.kt']]
def enginePlumbing = ['ScriptLoader.kt', 'ScriptExecutor.kt', 'ClientPulseDispatcher.kt', 'InMemoryJar.kt', 'LiveValues.kt']

pluginManager.apply('org.jetbrains.dokka')
// The Java site renders every signature the way a Java script calls it, e.g. extensions as static methods.
if (java) dependencies.add('dokkaPlugin', 'org.jetbrains.dokka:kotlin-as-java-plugin:2.3.0')
def sourceRoot = file('src/main/kotlin')
def visibility = extensions.getByName('dokka').class.classLoader
    .loadClass('org.jetbrains.dokka.gradle.engine.parameters.VisibilityModifier')
def hidden = partialPackages.collectMany { dir, keep ->
    (new File(sourceRoot, dir).listFiles() ?: []).findAll { it.isFile() && !(it.name in keep) }
} + enginePlumbing.collect { new File(sourceRoot, "com/projectx/script/$it") }

dokka {
    moduleName.set('Project X Script API')
    moduleVersion.set(apiVersion)
    if (java) dokkaPublications.named('html') { outputDirectory.set(layout.buildDirectory.dir('dokka/html-java')) }
    dokkaSourceSets.configureEach {
        includes.from(new File(docsDir, 'module.md'))
        documentedVisibilities.set([visibility.valueOf('Public'), visibility.valueOf('Protected')] as Set)
        reportUndocumented.set(false)
        skipEmptyPackages.set(true)
        jdkVersion.set(25)
        perPackageOption {
            def partial = partialPackages.keySet().collect { it.replace('/', '\\.') }.join('|')
            matchingRegex.set(/(?!(?:${apiPackages}|${partial})$).*/.toString())
            suppress.set(true)
        }
        suppressedFiles.from(hidden)
        sourceLink {
            localDirectory.set(sourceRoot)
            remoteUrl("https://github.com/iEasyScript/engine/blob/${engineTag}/client-plugin-engine/src/main/kotlin")
            remoteLineSuffix.set('#L')
        }
    }
    pluginsConfiguration.html {
        customStyleSheets.from(new File(docsDir, 'theme.css'), new File(docsDir, 'language-toggle.js'))
        footerMessage.set("Project X Script API ${apiVersion} (${java ? 'Java' : 'Kotlin'}) · built from engine ${engineTag}")
        homepageLink.set('https://github.com/iEasyScript/script-api')
    }
}
